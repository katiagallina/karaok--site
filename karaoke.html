﻿﻿﻿<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
</head>
<body class="page-karaoke">

<!-- Player YouTube invisivel mas na tela (evita bloqueio do navegador) -->
<div id="youtubePlayer"></div>

<div class="container">
    <div class="karaoke-screen">
        <header class="karaoke-header">
            <h1>&#127908; KARAOKE</h1>
            <h2 id="nomeMusica" class="karaoke-song-title">Carregando...</h2>
            <p id="nomeUsuario" class="karaoke-user"></p>
            <p id="loadingMusica" class="karaoke-loading">&#127925; Carregando audio...</p>
        </header>

        <div id="statusSincronia" class="status-sincronia" aria-hidden="true">Preparando sincronizacao da letra...</div>

        <div class="audio-player">
            <div class="audio-progress-wrap" id="progressWrap">
                <div class="audio-progress" id="audioProgress"></div>
            </div>
            <div class="audio-time">
                <span id="tempoAtual">0:00</span>
                <span id="tempoDuracao">0:00</span>
            </div>
            <div class="audio-controls">
                <button id="btnPlay" onclick="cantar()" class="audio-btn-play">
                    &#9654; COMECAR A CANTAR
                </button>
                <button onclick="pausarResumir()" id="btnPausar" class="audio-btn-pause" style="display:none;">
                    &#9646;&#9646; Pausar
                </button>
            </div>
        </div>

        <div class="score-wrap">
            <h2 id="pontuacao">&#11088; 0</h2>
        </div>

        <div class="karaoke-actions">
            <button onclick="finalizar()" class="btn btn-finalizar">
                &#9209; Finalizar
            </button>
        </div>

        <div class="karaoke-lyrics-card">
            <div class="letra" id="divLetra"></div>
        </div>
    </div>
</div>

<script src="js/script.js?v=16"></script>
</body>
</html>
