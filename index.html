<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaokê da Kaká</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&display=swap" rel="stylesheet">
</head>

<body class="page-home">

    <div class="particles"></div>

    <div class="container inicio">
        <h1 class="logo">Bem vindo ao<br>Karaokê da Kaká</h1>

        <p class="frase">Solte a voz e brilhe no palco ✨</p>

        <p class="descricao">
            Cante suas músicas favoritas, desafie amigos e conquiste o topo do ranking!
        </p>

        <div class="botoes">
            <a href="menu.html" class="btn iniciar">
                🎤 CANTAR AGORA
            </a>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="audios/bg.mp3" type="audio/mpeg">
    </audio>

    <script>
        const INTRO_LIBERADA_KEY = "karaokeIntroLiberada";

        document.querySelector(".btn.iniciar").addEventListener("click", function (event) {
            event.preventDefault();

            const urlDestino = this.getAttribute("href");
            sessionStorage.setItem(INTRO_LIBERADA_KEY, "true");

            const audio = document.getElementById("bgMusic");
            audio.play().catch(() => { });

            setTimeout(() => {
                window.location.href = urlDestino;
            }, 500);
        });
    </script>

</body>

</html>
